services:
  # ----------------------------------------------------------------------------
  # 1. Base de Datos PostgreSQL (Aislada en data_net - sin puertos al exterior)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: zt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hospital_zt}
      POSTGRES_USER: ${POSTGRES_USER:-zt_app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_postgres_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - data_net
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zt_app_user} -d ${POSTGRES_DB:-hospital_zt}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 2. HashiCorp Vault (Bóveda de Identificadores Directos y Tokenización)
  # ----------------------------------------------------------------------------
  vault:
    image: hashicorp/vault:1.17
    container_name: zt-vault
    restart: unless-stopped
    command:
      - "server"
      - "-dev"
      - "-dev-listen-address=0.0.0.0:8200"
      - "-dev-no-store-token"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID:-dev_vault_token_change_me}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
      # Evita conflicto entre setcap del entrypoint y no-new-privileges:true
      SKIP_SETCAP: "true"
      HOME: /tmp
    cap_add:
      - IPC_LOCK
    security_opt:
      - no-new-privileges:true
    networks:
      - vault_net
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 3. Open Policy Agent (Motor ABAC y Prevención de Function Creep)
  # ----------------------------------------------------------------------------
  opa:
    image: openpolicyagent/opa:latest-static
    container_name: zt-opa
    restart: unless-stopped
    user: "65534:65534"
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--log-level=info"
      - "/policies"
    volumes:
      - ./infra/opa/policies:/policies:ro
    networks:
      - policy_net
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/opa", "version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 4. Colector SIEM & Syslog RFC 5424 (Módulo C - Integrante 3: Samuel)
  # ----------------------------------------------------------------------------
  siem-collector:
    build:
      context: ./services/siem
      dockerfile: Dockerfile
    container_name: zt-siem-collector
    restart: unless-stopped
    environment:
      SIEM_SYSLOG_PORT: ${SIEM_SYSLOG_PORT:-5514}
      SIEM_UI_PORT: 8080
      SIEM_DB_PATH: /data/siem_events.db
    ports:
      # Solo accesible en loopback para exposición controlada vía cloudflared (siem.tralaleritosmigajeros.uk)
      - "127.0.0.1:${SIEM_UI_PORT:-8080}:8080"
    volumes:
      - siem_data:/data
    networks:
      - edge_net
      - audit_net
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 5. API Hospitalaria Privacy-by-Design (FastAPI - Módulos A & B)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: zt-hospital-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-zt_app_user}:${POSTGRES_PASSWORD:-dev_postgres_change_me}@postgres:5432/${POSTGRES_DB:-hospital_zt}
      VAULT_ADDR: http://vault:8200
      OPA_URL: http://opa:8181/v1/data/hospital/authz/decision
      SIEM_HOST: siem-collector
      SIEM_PORT: ${SIEM_SYSLOG_PORT:-5514}
    ports:
      # Solo loopback: el tráfico público entra exclusivamente por cloudflared
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
      opa:
        condition: service_started
      siem-collector:
        condition: service_healthy
    networks:
      - edge_net
      - data_net
      - vault_net
      - policy_net
      - audit_net
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      # En Fase 4 (Módulo C) se habilitará:
      # - seccomp=./infra/seccomp/api-seccomp.json
      # - apparmor=zt-hospital-api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

# ==============================================================================
# Segmentación de Redes Zero Trust
# Las redes internas bloquean salida directa a Internet y comunicación lateral
# ==============================================================================
networks:
  edge_net:
    driver: bridge
  data_net:
    driver: bridge
    internal: true
  vault_net:
    driver: bridge
    internal: true
  policy_net:
    driver: bridge
    internal: true
  audit_net:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  siem_data:
