name: CI - Calidad de Código, Pruebas y Políticas OPA

on:
  push:
    branches: ["main", "role/**"]
  pull_request:
    branches: ["main", "role/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality-and-tests:
    name: Calidad (Ruff + Complejidad) y Pruebas (Pytest + Cobertura)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            services/api/requirements.txt
            services/siem/requirements.txt

      - name: Instalar dependencias y herramientas de cobertura
        run: |
          python -m pip install --upgrade pip
          pip install -r services/api/requirements.txt -r services/siem/requirements.txt
          pip install pytest-cov

      - name: Verificar calidad, complejidad (McCabe) y reglas seguridad Ruff
        run: ruff check services/ tests/

      - name: Ejecutar suite completa Pytest con cobertura
        run: |
          pytest -v \
            --cov=services/api/app \
            --cov=services/siem/app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            tests/

      - name: Publicar reporte de cobertura como artefacto
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-coverage-report
          path: coverage.xml
          retention-days: 14

  validate-opa-and-infra:
    name: Validación OPA Rego (Strict + Tests), Docker Compose y Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validar sintaxis de docker-compose.yml y override AppArmor
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.apparmor.yml config -q

      - name: Validar sintaxis estricta de políticas Rego (OPA)
        run: |
          docker run --rm -v "${{ github.workspace }}/infra/opa/policies:/policies:ro" \
            openpolicyagent/opa:latest-static check --strict /policies

      - name: Ejecutar pruebas unitarias nativas de políticas ABAC (OPA)
        run: |
          docker run --rm -v "${{ github.workspace }}/infra/opa/policies:/policies:ro" \
            openpolicyagent/opa:latest-static test /policies -v

      - name: Validar perfil Seccomp-BPF y compilar sintaxis AppArmor (MC-01)
        run: |
          jq empty infra/seccomp/api-seccomp.json
          sudo apparmor_parser -Q -K infra/apparmor/zt-hospital-api

      - name: Prueba negativa de confinamiento Seccomp-BPF en contenedor Docker (MC-01)
        run: |
          docker run --rm \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --security-opt seccomp="${{ github.workspace }}/infra/seccomp/api-seccomp.json" \
            python:3.11-slim-bookworm \
            python3 -c "
          import ctypes, errno, os, socket
          try:
              os.fork()
              raise SystemExit('ERROR: os.fork() no fue bloqueado')
          except PermissionError as exc:
              assert exc.errno == errno.EPERM
          try:
              socket.socket(socket.AF_PACKET, socket.SOCK_RAW)
              raise SystemExit('ERROR: AF_PACKET no fue bloqueado')
          except PermissionError as exc:
              assert exc.errno == errno.EPERM
          libc = ctypes.CDLL(None, use_errno=True)
          assert libc.unshare(0x10000000) == -1 and ctypes.get_errno() == errno.EPERM
          assert libc.ptrace(0, 0, 0, 0) == -1 and ctypes.get_errno() == errno.EPERM
          print('Seccomp-BPF negative checks PASSED (EPERM)')
          "

      - name: Validar sintaxis y análisis estático (ShellCheck) de scripts Bash
        run: |
          for f in infra/scripts/*.sh; do
            echo "Checking $f"
            bash -n "$f"
          done
          shellcheck -S warning infra/scripts/*.sh
