services:
  # ============================================================================
  # Override Zero Trust para VM Ubuntu Server 26.04.1 LTS con AppArmor activo
  # Prerrequisito: sudo ./infra/scripts/install-apparmor-profile.sh
  # Uso:
  #   docker compose -f docker-compose.yml -f docker-compose.apparmor.yml up -d
  # ============================================================================
  api:
    security_opt:
      - no-new-privileges:true
      - seccomp=./infra/seccomp/api-seccomp.json
      - apparmor=zt-hospital-api
